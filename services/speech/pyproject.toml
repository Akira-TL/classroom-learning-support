[project]
name = "classroom-speech"
version = "0.1.0"
description = "课堂语音模块：双通道去噪、方位锚定分离、转写接入与契约事件服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pydantic>=2.5",
    "pypinyin>=0.50",
    "pyroomacoustics>=0.7",
    "scipy>=1.10",
    "soundfile>=0.12.1",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
# 现成模型：首次运行自动下载权重，需联网与 GPU；建议 Python 3.10/3.11
neural = [
    "funasr>=1.2",
    "modelscope>=1.20",
    "torch>=2.1",
    "torchaudio>=2.1",
    "clearvoice>=0.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
